services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: boardbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  milvus:
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      MINIO_USE_EMBED: "true"
    ports: ["19530:19530", "9091:9091"]

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopass
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/boardbot
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MM_MODEL: gemini-2.0-flash
    ports: ["9002:9000"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on: [postgres, mcp]
    environment:
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/boardbot
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports: ["8000:8000"]

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    depends_on: [api, postgres]
    environment:
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/boardbot
    ports: ["8501:8501"]
