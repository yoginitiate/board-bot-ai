# ============================================================================
# 서비스 운영 정책(Service Policy Config)
# ----------------------------------------------------------------------------
# 무엇: 모델/검색/검증/의사결정/라우팅 등 비즈니스 정책
# 왜: 서비스 품질/비용/리스크와 직결되며 인프라 설정과 변경 주기가 다름
# 누가/언제: 서비스/운영/ML 담당자가 정책 변경 시 조정
# 보안: API Key 자체는 파일에 저장하지 말고 api_key_env(환경변수 이름)만 명시
# ============================================================================
version: v1

# LLM 정책: provider/모델군 정의
llm:
  provider: google
  text_model: gemini-1.5-flash
  mm_model: gemini-2.0-flash
  embedding_model: models/embedding-001
  # 실제 키 값이 아니라 "키를 읽을 환경변수 이름"만 둔다.
  api_key_env: GOOGLE_API_KEY

# 하이브리드 RAG 정책
rag:
  sources_default: ["policy", "manual", "script"]
  hybrid:
    dense_top_k: 20
    sparse_top_k: 50
    final_top_k: 10
    fusion: rrf
    rrf_k: 60

# 분류 정책
classify:
  top_k: 6
  allowed_intents: ["상품 누락", "상품 오배송", "상품 미배송", "품절", "상품 파손", "주문 취소"]

# 이미지 사전판단(prevision) 정책
prevision:
  enabled_intents: ["상품 누락", "상품 오배송", "상품 미배송", "상품 파손"]
  confidence_threshold: 0.65
  max_images: 3
  timeout_s: 20
  retry:
    max_attempts: 1
    backoff_s: 0.5

# 검증/재작성 정책
validation:
  rewrite_max_attempts: 2
  grounding_threshold: 0.7

# 모드 라우팅 및 템플릿 위치
routing:
  scenario_template_dir: scenarios
  intent_mode_map:
    상품 누락: SCENARIO
    상품 오배송: SCENARIO
    상품 미배송: SCENARIO
    품절: SCENARIO
    상품 파손: AGENT
    주문 취소: SCENARIO

# 도구 허용 정책 (기본 allowlist)
tools:
  tools_allowed: ["rag_search", "get_order", "get_shipping", "get_claims", "get_customer", "get_inventory", "vision_triage", "ocr_extract", "post_reply", "notify_handoff"]

# 의사결정 정책
decision:
  allow_actions: ["auto_post", "draft"]
  auto_post_default: allow

# HANDOFF 알림 정책
handoff:
  notification_channels: ["webhook"]
