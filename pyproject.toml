[project]
name = "board-bot-ai"
version = "0.1.0"
description = "Board Agent MVP with LangGraph, FastAPI, FastMCP, and Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.2",
  "pyyaml>=6.0.2",
  "httpx>=0.27.2",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.1",
  "langchain>=0.3.0",
  "langgraph>=0.2.16",
  "langchain-google-genai>=2.0.0",
  "pymilvus>=2.4.6",
  "minio>=7.2.8",
  "streamlit>=1.38.0",
  "fastmcp>=0.1.0",
  "tenacity>=9.0.0",
  "orjson>=3.10.7",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "ruff>=0.6.4"]

[tool.uv]
dev-dependencies = ["pytest>=8.3.2", "ruff>=0.6.4"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
